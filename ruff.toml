# Ruff configuration for installer-dev-tools
# https://docs.astral.sh/ruff/configuration/

target-version = "py39"

[lint]
# Enable default rules plus isort
extend-select = ["I"]

# Baselined rules — to be addressed in follow-up PRs:
# - LOG015: root-logger calls (~452) → migrate to module-level logger
# - EXE001: shebangs on non-executable files (5) → remove or chmod +x
# - BLE001: bare except Exception (16) → narrow to specific exceptions
# - SIM102: collapsible nested if (10) → combine with and (risky auto-fix)
# - SIM115: open() without context manager (10) → rewrite with `with`
ignore = [
    "LOG015",
    "EXE001",
    "BLE001",
    "SIM102",
    "SIM115",
]
