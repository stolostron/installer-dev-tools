name: Python Linter

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"

jobs:
  ruff:
    name: Ruff lint on changed Python files
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Find modified Python files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: "**.py"

      - name: Run Ruff on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Linting changed Python files..."
          ruff check ${{ steps.changed-files.outputs.all_changed_files }}
