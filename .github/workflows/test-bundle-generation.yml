name: Bundle Generation Unit Tests

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/bundle-generation/**"

jobs:
  unit-tests:
    name: Run unit tests (offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/bundle-generation/requirements.txt

      - name: Run unit tests
        working-directory: scripts/bundle-generation
        run: python -m unittest discover -v -p "test_*.py"
